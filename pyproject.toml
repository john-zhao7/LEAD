[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-diagnostics"
version = "0.1.0"
description = "LEAD: Learning Experiment Automated Diagnostics"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Doctor John Lab"}]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
lead = "lead.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lead*"]
